<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | Expense Splitter</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <a href="./dashboard.html" class="logo">
            Expense Splitter
        </a>

        <div class="header-user">

            <img
                id="user-photo"
                class="user-photo"
                src=""
                alt="Profile"
            >

            <span id="user-name"></span>

            <button id="logout-btn" class="secondary-btn">
                Logout
            </button>

        </div>

    </header>


    <main class="dashboard">

        <!-- Welcome -->
        <section class="welcome-section">

            <div>
                <p class="eyebrow">Dashboard</p>

                <h1>
                    Welcome,
                    <span id="welcome-name">...</span>
                </h1>

                <p class="welcome-text">
                    Here's an overview of your expenses and groups.
                </p>
            </div>

        </section>


        <!-- Balance Cards -->
        <section class="balance-cards">

            <div class="balance-card owe-card">

                <div class="balance-card-header">
                    <span class="balance-icon">↓</span>

                    <span>Total you owe</span>
                </div>

                <h2 id="total-owe">₹0.00</h2>

                <p>
                    Money you need to pay
                </p>

            </div>


            <div class="balance-card owed-card">

                <div class="balance-card-header">
                    <span class="balance-icon">↑</span>

                    <span>Total owed to you</span>
                </div>

                <h2 id="total-owed">₹0.00</h2>

                <p>
                    Money others need to pay you
                </p>

            </div>

        </section>


        <!-- Groups -->
        <section class="groups-section">

            <div class="section-header">

                <div>
                    <p class="eyebrow">Groups</p>

                    <h2>Your Groups</h2>
                </div>

                <button
                    id="create-group-btn"
                    class="primary-btn"
                >
                    + Create Group
                </button>

            </div>


            <div
                id="groups-container"
                class="groups-container"
            >
                <div class="loading-state">
                    Loading groups...
                </div>
            </div>

        </section>

    </main>


    <!-- Create Group Modal -->
    <div
        id="create-group-modal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <p class="eyebrow">New Group</p>
                    <h2>Create Group</h2>
                </div>

                <button
                    id="close-group-btn"
                    class="close-btn"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="create-group-form">

                <label for="group-name">
                    Group name
                </label>

                <input
                    type="text"
                    id="group-name"
                    placeholder="e.g. Goa Trip"
                    maxlength="100"
                    autocomplete="off"
                    required
                >

                <p
                    id="group-error"
                    class="form-error"
                ></p>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancel-group-btn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="submit-group-btn"
                        class="primary-btn"
                    >
                        Create Group
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script type="module" src="../js/dashboard.js"></script>

</body>

</html>
