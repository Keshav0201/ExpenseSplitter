<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->

    <title>Expense Splitter — Split Expenses Easily with Friends</title>

    <meta
      name="description"
      content="Expense Splitter makes it easy to split bills, track shared expenses, see who owes whom, and settle up with friends."
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="Keshav Didwania" />

    <meta
      name="keywords"
      content="expense splitter, split expenses, split bills, bill splitter, shared expenses, group expenses, expense tracker, split expenses with friends"
    />

    <!-- Canonical -->

    <link rel="canonical" href="https://exsplit.keshavdidwania.in/" />

    <!-- Open Graph -->

    <meta
      property="og:title"
      content="Expense Splitter — Split Expenses Easily with Friends"
    />

    <meta
      property="og:description"
      content="Split bills, track shared expenses, see who owes whom, and settle up with friends without the awkward calculations."
    />

    <meta property="og:url" content="https://exsplit.keshavdidwania.in/" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Expense Splitter" />

    <!-- Twitter / X -->

    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Expense Splitter — Split Expenses Easily with Friends"
    />

    <meta
      name="twitter:description"
      content="Split bills, track shared expenses, see who owes whom, and settle up with friends."
    />

    <!-- Styles -->

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>

  <body>
    <div class="progress-bar-container" id="progress-bar-container">
      <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
        <span id="progress-text">Loading..</span>
      </div>
    </div>
    <!-- Header -->
    <header class="group-header">
      <a href="./dashboard.html" class="back-link"> ← Dashboard </a>

      <button id="logout-btn" class="secondary-btn">Logout</button>
    </header>

    <main class="profile-page">
      <section class="profile-section">
        <div class="section-header">
          <div>
            <p class="eyebrow">Account</p>
            <h1>Profile</h1>
          </div>
        </div>

        <form id="profile-form">
          <!-- Name -->
          <label for="profile-name"> Name </label>

          <input
            type="text"
            id="profile-name"
            placeholder="Your name"
            required
          />

          <!-- Username -->
          <label for="profile-username"> Userame </label>

          <input
            type="text"
            id="profile-username"
            placeholder="Username (Can only be updated once)"
          />

          <!-- Email -->
          <label for="profile-email"> Email </label>

          <input type="email" id="profile-email" disabled />

          <!-- UPI ID -->
          <label for="profile-upi"> UPI ID </label>

          <input type="text" id="profile-upi" placeholder="example@upi" />

          <p class="input-hint">
            Add your UPI ID so group members can pay you directly.
          </p>

          <p id="profile-error" class="form-error"></p>

          <p id="profile-success" class="success-message"></p>

          <button type="submit" id="save-profile-btn" class="primary-btn">
            Save Changes
          </button>
        </form>
      </section>
    </main>

    <script
      defer
      crossorigin="anonymous"
      src="https://clerk.exsplit.keshavdidwania.in/npm/@clerk/ui@1/dist/ui.browser.js"
      type="text/javascript"
    ></script>

    <script
      defer
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_live_Y2xlcmsuZXhzcGxpdC5rZXNoYXZkaWR3YW5pYS5pbiQ"
      src="https://clerk.exsplit.keshavdidwania.in/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <script type="module" src="../js/profile.js"></script>
  </body>
</html>
